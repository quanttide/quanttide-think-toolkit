[package]
name = "quanttide-think"
version = "0.1.0-alpha.2"
edition = "2021"
description = "量潮认知工程Rust工具箱 — 数据模型（想法、意图、情境、图式）"
license = "MIT"

[features]
default = ["json"]
json = []
yaml = ["serde_yaml"]

[dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
serde_yaml = { version = "0.9", optional = true }

[dev-dependencies]
serde_yaml = "0.9"
